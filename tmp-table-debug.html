<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Debug</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: sans-serif;
      }
      .wrap {
        width: 400px;
        border: 1px solid #ccc;
        padding: 8px;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }
      thead {
        border: 0;
      }
      tr {
        border-bottom: 1px solid #ddd;
      }
      th, td {
        padding: 8px;
        border: 0;
      }
      .debug {
        margin-top: 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <table id="table">
        <thead id="thead">
          <tr>
            <th>Tag</th>
            <th>Description</th>
            <th>Links</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>foo</td>
            <td>bar</td>
            <td>1</td>
          </tr>
        </tbody>
      </table>
      <div class="debug" id="info"></div>
    </div>
    <script>
      const table = document.getElementById('table');
      const thead = document.getElementById('thead');
      const info = document.getElementById('info');
      const show = () => {
        const tableRect = table.getBoundingClientRect();
        const theadRect = thead.getBoundingClientRect();
        info.textContent = `table: ${Math.round(tableRect.width)}px, thead: ${Math.round(theadRect.width)}px, diff: ${Math.round(tableRect.width - theadRect.width)}px`;
      };
      window.addEventListener('load', show);
      window.addEventListener('resize', show);
    </script>
  </body>
</html>
